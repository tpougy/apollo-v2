[project]
name = "apollo-cli"
# Installed-version source of truth: apollo_cli/version_check.py compares
# this against the latest GitHub tag on tpougy/apollo-v2 to decide whether
# to warn. Bump this to match each new milestone git tag going forward.
version = "1.5"
description = "Apollo v2 CLI — AI-operated channel with full parity with the web SPA"
readme = "README.md"
authors = [
    { name = "tpougy", email = "thomazpougy@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "click>=8.4,<9",
    "python-dotenv>=1.2,<2",
    "instantdb>=1.0.63,<2",
    "bizdays>=1.0.19",
    "httpx>=0.27,<1",
]

[project.scripts]
apollo = "apollo_cli.cli:main"

[build-system]
requires = ["uv_build>=0.9.21,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16,<0.17",
    "ty>=0.0.69",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["."]

[tool.ruff.lint]
extend-select = ["I", "ANN"]

# apollo_cli/cli.py's apollo() group callback wraps version_check.maybe_warn_outdated()
# in a single deliberate bare try/except Exception: pass — the one absolute last-resort
# guarantee that this best-effort version-check UX nicety can never block, delay, or
# fail the real command underneath it, no matter what future bug lands in
# version_check.py (see cli/.planning/quick/260924-gfd .../260924-gfd-PLAN.md's threat
# model T-gfd-01). BLE001 (blind except) and S110 (try/except/pass without logging)
# both correctly flag broad excepts in general — this is the one call site in the
# codebase where that is the intended, load-bearing behavior, not an oversight.
[tool.ruff.lint.per-file-ignores]
"apollo_cli/cli.py" = ["BLE001", "S110"]

[tool.ty.environment]
python-version = "3.12"

[tool.pytest.ini_options]
markers = [
    "live: exercises the real InstantDB app over the network using the persisted session (skips when no session exists)",
    "packaging: exercises real subprocess uv build/uv venv/uv pip install filesystem/build tooling (PKG-05) — not the InstantDB network API; kept distinct from `live` so `uv run pytest -m \"not live and not packaging\"` stays a fast, fully-offline inner loop",
]
