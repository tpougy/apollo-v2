[project]
name = "apollo-cli"
version = "0.1.0"
description = "Apollo v2 CLI — AI-operated channel with full parity with the web SPA"
readme = "README.md"
authors = [
    { name = "tpougy", email = "thomazpougy@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "click>=8.4,<9",
    "python-dotenv>=1.2,<2",
    "instantdb>=1.0.63,<2",
    "bizdays>=1.0.19",
]

[project.scripts]
apollo = "apollo_cli.cli:main"

[build-system]
requires = ["uv_build>=0.9.21,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16,<0.17",
    "ty>=0.0.69",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["."]

[tool.ruff.lint]
extend-select = ["I", "ANN"]

[tool.ty.environment]
python-version = "3.12"

[tool.pytest.ini_options]
markers = [
    "live: exercises the real InstantDB app over the network using the persisted session (skips when no session exists)",
]
